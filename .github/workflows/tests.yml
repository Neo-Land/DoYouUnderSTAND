name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Lightweight deps only: the tested modules don't need MediaPipe.
      - run: pip install numpy pyyaml pytest ruff opencv-python-headless pillow
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: pytest -q
