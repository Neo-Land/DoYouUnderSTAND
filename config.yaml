# Do You UnderSTAND: configuration
# Paths are relative to the project folder.

camera:
  index: 0            # try 1 or 2 if the wrong camera opens
  width: 1280
  height: 720
  mirror: true        # show yourself like a mirror

extraction:
  videos_dir: data/videos
  output_csv: data/landmarks.csv
  stride: 2           # use every 2nd frame (neighbouring frames are near-duplicates)
  trim_fraction: 0.15 # skip the first/last 15% of each clip (stepping into/out of the pose)
  max_height: 720     # downscale bigger videos for speed

training:
  model_path: models/pose_classifier.joblib
  reports_dir: reports/poses

# Hold a pose to summon its Stand; it stays until you hold the dismiss pose (arms up in a Y).
# A pose "wins" while it has min_votes of the last `window` frames (frames below `threshold`
# confidence vote "none"). Tune with scripts/poses/eval_live.py + scripts/poses/tune_smoothing.py.
recognition:
  threshold: 0.4        # minimum confidence for a frame to vote for its pose
  window: 15            # frames in the voting window (~0.5 s at 30 fps)
  min_votes: 9          # votes out of the window a pose needs to be winning
  hold_seconds: 1.5     # a Stand pose must keep winning this long to summon (or switch to) its Stand
  dismiss_seconds: 1.0  # the dismiss pose must keep winning this long to send the Stand away
  absent_seconds: 5.0   # the Stand also leaves after this long with nobody framed in view

effects:
  fade_seconds: 0.35
  stand_scale: 2.4    # Stand height, in torso lengths
  stand_offset_x: 0.7 # sideways shift, in torso lengths (+ = screen right)
  stand_offset_y: -0.15 # vertical shift of the Stand's centre from the shoulders (- = up)
  stand_fade_bottom: 0.25 # fade the bottom 25% of each Stand image to transparent (0 = off)
  keep_in_frame: true     # shrink/shift Stands so they don't leave the top or sides of the screen
  stand_max_height: 0.95  # ...and are never taller than this share of the frame height
  menacing_text: true
  menacing_char: "ゴ"
  sound: true
  volume: 0.8
  default_sound: assets/sounds/menacing.wav   # played when a Stand has no sound of its own

# One entry per pose. The key must match the clip names (jotaro_s1.mp4 -> jotaro).
# Optional per-Stand overrides: scale, offset_x, offset_y, fade_bottom (same units as effects:)
stands:
  jotaro:
    pose: "The Direct Point"
    user: "Jotaro Kujo"
    stand: "Star Platinum"
    image: assets/stands/jotaro.png
    sound: assets/sounds/jotaro.wav
    scale: 3.0        # waist-up image
    offset_x: 0.45
    offset_y: -0.45
  giorno:
    pose: "The High-Fashion Collar Grab"
    user: "Giorno Giovanna"
    stand: "Gold Experience"
    image: assets/stands/giorno.png
    sound: assets/sounds/giorno.wav
    scale: 3.4        # full-body image
    offset_x: 0.6
    offset_y: -0.1
  josuke:
    pose: "The S-Curve Backbend"
    user: "Josuke Higashikata"
    stand: "Crazy Diamond"
    image: assets/stands/josuke.png
    sound: assets/sounds/josuke.wav
    scale: 3.0        # waist-up image
    offset_x: 0.6
    offset_y: -0.3
  bucciarati:
    pose: "The Floating Wrist-Cross"
    user: "Bruno Bucciarati"
    stand: "Sticky Fingers"
    image: assets/stands/bucciarati.png
    sound: assets/sounds/bucciarati.wav
    scale: 3.4        # full-body image
    offset_x: 0.85
    offset_y: -0.1
  diego:
    pose: "The Bestial Low Crouch"
    user: "Diego Brando"
    stand: "Scary Monsters"
    image: assets/stands/diego.png
    sound: assets/sounds/diego.wav
    scale: 2.8        # wide dinosaur image; faces left, toward the user (crouch shortens the torso)
    offset_x: 1.1
    offset_y: -0.2
  kira:
    pose: "The L-Shaped Hand Frame"
    user: "Yoshikage Kira"
    stand: "Killer Queen"
    image: assets/stands/kira.png
    sound: assets/sounds/kira.wav
    scale: 3.0        # waist-up image
    offset_x: 0.5
    offset_y: -0.4

# ------------------------------------------------------------------ ASL word signs (ASL Citizen)
# Microsoft Research license: non-commercial research only. The videos, landmarks and models made
# from them stay in datasets/, data/ and models/ (all git-ignored). Only code and numbers are public.
signs:
  dataset_zip: datasets/asl_citizen/ASL_Citizen.zip   # the full download (~46 GB)
  dataset_dir: datasets/asl_citizen                   # where the chosen signs' videos are unpacked
  landmarks_dir: data/asl_signs                       # per-video landmarks + index.csv
  models_dir: models                                  # sign_logreg.joblib, sign_gru.pt
  reports_dir: reports/signs
  # 100 everyday signs, as ASL Citizen glosses. A trailing digit picks one of several signs for the
  # same English word (the variant with the most videos). Edit, then re-run scripts/signs/*.py.
  vocabulary: [   # quoted: bare YES / NO would be read as booleans by YAML
    "HELLO", "BYE", "THANKYOU", "PLEASE", "SORRY", "YES", "NO", "HELP", "WANT1", "NEED",
    "LIKE", "LOVE", "GOOD", "BAD", "HAPPY", "SAD", "ANGRY", "TIRED", "HUNGRY", "EAT1",
    "DRINK1", "WATER", "MORE", "FINISH", "STOP", "GO", "COME", "WAIT", "WORK", "SCHOOL",
    "HOME", "FAMILY", "MOTHER", "FATHER", "FRIEND", "NAME", "WHAT1", "WHO", "WHERE", "WHEN",
    "WHY", "HOW1", "UNDERSTAND", "KNOW", "THINK", "LEARN", "SIGN", "DEAF1", "HEARING", "TEACHER",
    "STUDENT", "BOOK", "COMPUTER", "PHONE", "TIME", "DAY", "NIGHT1", "TODAY", "TOMORROW", "YESTERDAY",
